name: AUR release sync

# 업스트림 릴리스 확인 → PKGBUILD/.SRCINFO 갱신 → 미러 저장소 커밋 → AUR push
# 필요한 secret: AUR_SSH_PRIVATE_KEY  (AUR 계정에 등록한 전용 키의 개인키)
# 필요한 secret 아님: GITHUB_TOKEN (자동 제공)

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 (GitHub schedule은 지연될 수 있음)
  workflow_dispatch:
    inputs:
      bump_pkgrel:
        description: '업스트림 변경이 없어도 pkgrel을 올려 AUR push 경로를 검증합니다'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: aur-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
      options: --user root
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_KEY: /root/.ssh/aur_ci
      AUR_ROOT: /tmp/aur-push
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git curl jq python openssh

      - uses: actions/checkout@v4

      - name: Prepare build user and git
        run: |
          useradd -m builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name  "aur-bot"
          git config --global user.email "aur-bot@users.noreply.github.com"

      - name: Detect and update packages
        id: update
        env:
          BUMP_PKGREL: ${{ inputs.bump_pkgrel && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          changed_pkgs=""
          changed_versions=""

          update_pkg() {
            local pkgdir=$1 repo=$2 pretag=$3
            local log="/tmp/update-${pkgdir}.log"
            bash scripts/update-package.sh "$pkgdir" "$repo" "$pretag" | tee "$log"
            if grep -q '^CHANGED=1$' "$log"; then
              local ver
              ver=$(sed -n 's/^pkgver=//p' "${pkgdir}/PKGBUILD")
              changed=1
              changed_pkgs="${changed_pkgs}${pkgdir} "
              changed_versions="${changed_versions}${pkgdir}=${ver} "
              git diff --stat -- "${pkgdir}/PKGBUILD" "${pkgdir}/.SRCINFO" || true
            fi
          }

          update_pkg ieumoffice-bin pblsketch/openoffice v
          update_pkg rhwp_bin edwardkim/rhwp v

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "packages=${changed_pkgs}" >> "$GITHUB_OUTPUT"
          echo "versions=${changed_versions}" >> "$GITHUB_OUTPUT"

      - name: Validate updated package sources
        if: steps.update.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          for pkg in ${{ steps.update.outputs.packages }}; do
            echo "::group::verify $pkg"
            rm -rf "/tmp/verify-${pkg}" && cp -r "$pkg" "/tmp/verify-${pkg}"
            chown -R builder:builder "/tmp/verify-${pkg}"
            su builder -s /bin/bash -c "cd '/tmp/verify-${pkg}' && makepkg --verifysource --noconfirm"
            echo "::endgroup::"
          done

      - name: Commit to mirror repository
        if: steps.update.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          for pkg in ${{ steps.update.outputs.packages }}; do
            git add "${pkg}/PKGBUILD" "${pkg}/.SRCINFO"
          done
          if git diff --cached --quiet; then
            echo "no staged package changes"
            exit 0
          fi
          msg=""
          for pair in ${{ steps.update.outputs.versions }}; do
            p="${pair%%=*}"
            v="${pair#*=}"
            if [ -n "$msg" ]; then msg="${msg}, "; fi
            msg="${msg}${p}: update to ${v}"
          done
          git commit -m "$msg"
          git push

      - name: Deploy to AUR
        if: steps.update.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m700 /root/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$AUR_KEY"
          chmod 600 "$AUR_KEY"
          ssh-keyscan -t ed25519 aur.archlinux.org >> /root/.ssh/known_hosts 2>/dev/null
          bash scripts/deploy-aur.sh
          rm -f "$AUR_KEY"

      - name: Keepalive (schedule 비활성화 방지)
        if: always()
        shell: bash
        run: |
          # 공개 저장소는 60일간 커밋이 없으면 schedule 워크플로가 자동 비활성화된다.
          # 매주 월요일에 타임스탬프 커밋을 남겨 이를 방지한다.
          if [ "$(date -u +%u)" != "1" ]; then
            echo "월요일이 아니므로 생략"
            exit 0
          fi
          mkdir -p .github
          date -u +%FT%TZ > .github/last-sync
          git add .github/last-sync
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: keepalive $(date -u +%F)"
            git push
          fi

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          title="AUR 동기화 실패: $(date -u +%F)"
          body="로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"${title}\",\"body\":\"${body}\"}" \
            > /dev/null || echo "이슈 생성 실패 (무시)"
